<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>봉봉아 제발 한 입만 먹어줘!</title>
    <style>
        /* ===== 픽셀 폰트: Galmuri (SIL OFL) — 글자 일부만 담은 경량 버전 ===== */
        @font-face { font-family: 'Pix'; src: url('Galmuri11-Bold-sub.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }

        :root { --ink: #3b2418; --paper: #fff6df; --gold: #ffcc00; }
        * { box-sizing: border-box; }

        body { font-family: 'Pix', 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: 700; color: var(--ink); margin: 0; min-height: 100vh; padding: 10px; display: flex; align-items: center; justify-content: center; overscroll-behavior-y: contain;
               background-color: #f3d9a4;
               background-image: linear-gradient(45deg, #ecc98a 25%, transparent 25%, transparent 75%, #ecc98a 75%), linear-gradient(45deg, #ecc98a 25%, transparent 25%, transparent 75%, #ecc98a 75%);
               background-size: 32px 32px; background-position: 0 0, 16px 16px; }

        /* 도트 아이콘 (eat_icons.png) — --is: 16px 아이콘의 배율 */
        .ic { display: inline-block; width: calc(16px * var(--is, 1)); height: calc(16px * var(--is, 1)); background: url('eat_icons.png') no-repeat; image-rendering: pixelated; vertical-align: -0.2em;
              background-size: calc(128px * var(--is, 1)) calc(64px * var(--is, 1)); background-position: calc(var(--ix) * -16px * var(--is, 1)) calc(var(--iy) * -16px * var(--is, 1)); }

        .game-container { width: 100%; max-width: 480px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 0 0 4px var(--gold), 0 0 0 8px var(--ink), 10px 10px 0 8px rgba(59,36,24,0.25); text-align: center; overflow: hidden; margin: 8px; position: relative; }
        .header { background: var(--gold); padding: 12px; margin: 0; color: var(--ink); display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--ink); }
        .header h2 { margin: 0; font-size: 16px; letter-spacing: -0.5px; text-align: left; }
        .stats { display: flex; gap: 5px; flex-direction: column; align-items: flex-end; }
        .stat-bars { display: flex; gap: 4px; }
        .health-bar, .stress-bar { font-size: 12px; font-weight: bold; background: #fff; padding: 4px 6px; border: 2px solid var(--ink); white-space: nowrap; }
        .health-bar { color: #c62828; } .stress-bar { color: #5e35b1; }
        #buff-status { font-size: 11px; font-weight: bold; color: #e65100; background: #fff3e0; padding: 3px 6px; border: 2px solid #ffb74d; display: none; }

        .phase { padding: 14px; display: none; } .phase.active { display: block; }

        /* ===== 주방 장면 ===== */
        .scene { position: relative; width: calc(100% - 8px); max-width: 432px; aspect-ratio: 4 / 3; margin: 4px auto 14px; background: url('eat_kitchen_bg.png') 0 0 / 100% 100% no-repeat; image-rendering: pixelated; box-shadow: 0 0 0 4px var(--ink), 0 0 0 8px #fff; overflow: hidden; }
        .dog-host { position: absolute; z-index: 2; transform-origin: 50% 100%; }
        .dog-host.shake { animation: shake 0.14s steps(2) infinite; }
        .dog-host.sick { filter: hue-rotate(55deg) saturate(1.3) brightness(0.92); }
        .dog-host.chew { animation: chew 0.2s steps(2) infinite; }
        @keyframes shake { 0% { transform: translateX(-3px); } 100% { transform: translateX(3px); } }
        @keyframes chew { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.94); } }
        .fx-layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
        .fx { position: absolute; background: url('eat_fx.png') no-repeat; image-rendering: pixelated; pointer-events: none; }
        .fx.fly { background: none; }
        .crumb { position: absolute; pointer-events: none; }

        .bonbong-status { background: #fff; padding: 10px 12px; margin: 0 4px 14px; font-weight: bold; font-size: 13px; line-height: 1.5; color: #b71c1c; border: 4px solid var(--ink); box-shadow: inset 0 0 0 2px #ffcdd2; position: relative; text-align: left; }
        .bonbong-status::before { content: ''; position: absolute; top: -14px; left: 30px; border: 8px solid transparent; border-bottom: 8px solid var(--ink); border-top: 0; }
        .bonbong-status::after { content: ''; position: absolute; top: -8px; left: 33px; border: 5px solid transparent; border-bottom: 5px solid #fff; border-top: 0; }

        .inventory { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; min-height: 70px; }
        .item { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 5px 4px 4px; border: 3px solid var(--ink); background: #fff; user-select: none; width: 58px; position: relative; box-shadow: 0 3px 0 rgba(59,36,24,0.35); }
        .item .emoji { line-height: 0; } .item .name { font-size: 11px; font-weight: bold; margin-top: 3px; color: #555; letter-spacing: -0.5px; white-space: normal; word-break: keep-all; text-align: center; line-height: 1.15; min-height: 26px; display: flex; align-items: center; justify-content: center; }
        .item > div[style] { border-radius: 0 !important; font-family: inherit; }
        .item.selected { background: #c8e6c9; border-color: #2e7d32; transform: translateY(-4px); box-shadow: 0 7px 0 #2e7d32; }
        .cook-board { background: #fff3e0; padding: 12px; margin: 0 4px 14px; border: 3px dashed #ff9800; min-height: 110px; }
        #selected-list { display: inline-block; min-height: 32px; vertical-align: middle; }

        button { font-family: inherit; background: #ff5722; color: #fff; border: 3px solid var(--ink); padding: 9px 12px; font-size: 14px; cursor: pointer; font-weight: bold; margin: 5px; border-radius: 0; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.25), inset 3px 3px 0 rgba(255,255,255,0.35), 0 4px 0 var(--ink); position: relative; top: 0; }
        button:hover { filter: brightness(1.08); }
        button:active { top: 4px; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.25), inset 3px 3px 0 rgba(255,255,255,0.35), 0 0 0 var(--ink); }
        .btn-maze { background: #4caf50; } .btn-home { background: #757575; }

        #result-msg { margin-top: 14px; font-size: 13px; color: #333; font-weight: bold; line-height: 1.55; min-height: 80px; }
        #result-msg > div { border-radius: 0 !important; border-width: 3px !important; }

        #animation-area { display: none; padding: 14px 0; }
        #anim-text { font-size: 14px; font-weight: bold; color: #e65100; animation: blink 0.8s steps(2) infinite; }

        #catch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .timer-box { font-size: 16px; font-weight: bold; color: #d32f2f; background: #ffebee; padding: 4px 8px; border: 3px solid var(--ink); }
        #catch-board { width: 100%; max-width: 440px; height: 400px; background: #8fd0f5 url('eat_market_bg.png') 0 0 / 100% 100% no-repeat; image-rendering: pixelated; position: relative; overflow: hidden; border: 4px solid var(--ink); margin: 0 auto 10px auto; touch-action: none; cursor: pointer; }
        #player { position: absolute; width: 40px; height: 40px; user-select: none; z-index: 10; }
        .pl-host { position: absolute; left: 50%; margin-left: -26px; bottom: 0; width: 52px; height: 47.5px; }
        /* 시장 지붕 발판: 나무 상자 느낌 */
        .platform { position: absolute; z-index: 5; border: 3px solid #5d4037; border-top: 0;
                    background: linear-gradient(to bottom, #ffe0b2 0, #ffe0b2 4px, #8d5b3a 4px, #8d5b3a 5px, transparent 5px),
                                repeating-linear-gradient(90deg, #c68a53 0, #c68a53 10px, #b57a45 10px, #b57a45 12px);
                    box-shadow: 0 3px 0 rgba(59,36,24,0.35); }
        .platform::before { content: ''; position: absolute; left: -3px; right: -3px; top: 0; height: 4px; background: #5d4037; }
        .falling-item { position: absolute; width: 30px; height: 30px; user-select: none; z-index: 8; display: flex; align-items: center; justify-content: center; line-height: 0; }
        .falling-item .ic { transform: translateY(0); animation: floaty 0.8s steps(2) infinite; }
        @keyframes floaty { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
        .instruction-box { background: #fff9c4; border: 3px dashed #fbc02d; padding: 8px; margin-bottom: 10px; }

        #hospital-phase { background: #ffebee; color: #b71c1c; }
        .siren { margin: 16px 0; animation: blink 1s steps(2) infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
        /* ===== 말랑 도트 테마: 연한 외곽선 · 둥근 모서리 · 파스텔 ===== */
        :root { --ink: #b07c5f; --text: #6a4033; --paper: #fffaf0; }
        body { color: var(--text); }
        .header, .header h2, .toy-btn, .btn, .item, .stat-box, .guide-text, .status-text { color: var(--text); }
        .game-container { border-radius: 22px; border-width: 3px !important; box-shadow: 0 0 0 5px var(--theme, var(--gold)), 0 0 0 8px var(--ink), 0 14px 0 8px rgba(130,90,70,.16) !important; }
        .header { border-bottom-width: 3px !important; background-image: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,0) 70%); color: var(--text); }
        .health-bar, .stress-bar { border: 2px solid var(--ink) !important; border-radius: 12px; box-shadow: 0 2px 0 rgba(130,90,70,.2); }
        button, .btn { border-radius: 12px !important; border: 3px solid rgba(110,64,48,.5) !important;
                       box-shadow: inset -3px -4px 0 rgba(0,0,0,.12), inset 3px 3px 0 rgba(255,255,255,.55), 0 4px 0 rgba(110,64,48,.38) !important; }
        button:active, .btn:active { top: 4px; box-shadow: inset -3px -4px 0 rgba(0,0,0,.12), inset 3px 3px 0 rgba(255,255,255,.55), 0 0 0 rgba(110,64,48,.38) !important; }
        .btn-home { background: #a9a1b8 !important; }
        .item, .timer-box, .bonbong-status, .instruction-box, .guide-text, .toy-btn, #result-msg > div, .inventory, .cook-board, #selected-list { border-radius: 14px; }
        .item, .timer-box, .bonbong-status, .instruction-box, .guide-text, .toy-btn, #result-msg > div { border-color: var(--ink) !important; }
        .toy-btn { border-width: 3px !important; }
        .scene, #catch-board, #field, #board { border-radius: 14px; border-color: var(--ink) !important; overflow: hidden; border-width: 3px !important; }
        #joystick-base { border-color: var(--ink); } #joystick-stick { border-color: var(--ink); }
        #top-ui { border-bottom-color: var(--ink) !important; }

        /* ===== 봉봉이 모션 ===== */
        .m-wiggle { animation: mWiggle .36s steps(4) infinite; }
        .m-spin   { animation: mSpin .5s steps(4) 3; }
        .m-roll   { animation: mRoll .55s steps(8) 2; transform-origin: 50% 55% !important; }
        .m-bounce { animation: mBounce .3s steps(3) 3; }
        .m-tilt   { animation: mTilt 1.4s steps(3) 1 forwards; }
        .m-dance  { animation: mDance .4s steps(4) infinite; }
        .m-faint  { animation: mFaint .9s steps(6) 1 forwards; }
        .m-shiver { animation: mShiver .08s steps(2) infinite; }
        .m-breath { animation: mBreath 1.2s steps(2) infinite; }
        @keyframes mWiggle { 0% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } 100% { transform: rotate(-7deg); } }
        @keyframes mSpin { 0% { transform: scaleX(1); } 25% { transform: scaleX(.15); } 50% { transform: scaleX(-1); } 75% { transform: scaleX(.15); } 100% { transform: scaleX(1); } }
        @keyframes mRoll { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        @keyframes mBounce { 0% { transform: scale(1.1,.88); } 50% { transform: translateY(-10px) scale(.93,1.1); } 100% { transform: scale(1.1,.88); } }
        @keyframes mTilt { 0% { transform: rotate(0); } 35% { transform: rotate(-11deg); } 70% { transform: rotate(9deg); } 100% { transform: rotate(0); } }
        @keyframes mDance { 0% { transform: rotate(-6deg); } 25% { transform: translateY(-7px); } 50% { transform: rotate(6deg); } 75% { transform: translateY(-7px); } 100% { transform: rotate(-6deg); } }
        @keyframes mFaint { 0% { transform: rotate(0); } 30% { transform: rotate(-6deg); } 60% { transform: rotate(12deg); } 100% { transform: rotate(82deg) translate(6px, 8px); } }
        @keyframes mShiver { 0% { transform: translateX(-1.5px); } 100% { transform: translateX(1.5px); } }
        @keyframes mBreath { 0% { transform: scaleY(1); } 100% { transform: scaleY(.95); } }

        /* ===== 몽글몽글 테마 (위 규칙을 덮어씀) ===== */
        :root { --ink: #d9ad94; --text: #7a4a3c; --paper: #fffbf4; }
        body { background-color: var(--bg-a, #ffdbe8) !important;
               background-image: repeating-linear-gradient(90deg, var(--bg-b, rgba(255,255,255,.5)) 0 18px, transparent 18px 36px), repeating-linear-gradient(0deg, var(--bg-b, rgba(255,255,255,.5)) 0 18px, transparent 18px 36px) !important;
               background-size: auto !important; background-position: 0 0 !important; }
        .game-container { border-radius: 30px; border: 3px solid #fff !important; background: var(--paper);
                          box-shadow: 0 0 0 4px var(--theme, var(--gold)), 0 0 0 7px #fff, 0 10px 0 7px rgba(190,140,115,.28), 0 18px 30px rgba(190,140,115,.25) !important; }
        .header { position: relative; z-index: 3; border-bottom: 0 !important; padding-bottom: 14px; border-radius: 26px 26px 0 0;
                  background-image: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,0) 75%); }
        .header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px; z-index: 3; pointer-events: none;
                         background: radial-gradient(circle at 9px 0, var(--theme, var(--gold)) 9px, transparent 10px) 0 0 / 18px 10px repeat-x; }
        .health-bar, .stress-bar { border: 2px solid #fff !important; border-radius: 999px; padding: 4px 9px; box-shadow: 0 3px 0 rgba(190,140,115,.3); }
        button, .btn { border-radius: 999px !important; border: 3px solid rgba(255,255,255,.85) !important; text-shadow: 0 1px 0 rgba(0,0,0,.18);
                       background-image: linear-gradient(rgba(255,255,255,.38), rgba(255,255,255,0) 55%) !important;
                       box-shadow: inset 0 -4px 0 rgba(0,0,0,.1), 0 5px 0 rgba(150,95,75,.32), 0 8px 10px rgba(150,95,75,.18) !important; }
        button:active, .btn:active { top: 4px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.1), 0 1px 0 rgba(150,95,75,.32) !important; }
        .btn-home { background-color: #b9aed0 !important; }
        .btn { background-color: #fffaf0; } .btn:active { background-color: var(--theme); }
        .item, .timer-box, .bonbong-status, .instruction-box, .guide-text, .toy-btn, #result-msg > div, .inventory, .cook-board, #selected-list { border-radius: 20px; }
        .item, .timer-box, .bonbong-status, .instruction-box, .guide-text, .toy-btn, #result-msg > div { border: 3px solid #fff !important; box-shadow: 0 0 0 2px var(--ink), 0 4px 0 rgba(190,140,115,.25) !important; }
        .item.selected { box-shadow: 0 0 0 3px var(--theme, var(--gold)), 0 4px 0 rgba(190,140,115,.3) !important; }
        .toy-btn { box-shadow: inset 0 0 0 4px var(--tc), 0 0 0 2px var(--ink), 0 5px 0 rgba(190,140,115,.3) !important; }
        .scene, #catch-board, #field, #board { border-radius: 22px; border: 4px solid #fff !important; box-shadow: 0 0 0 2px var(--ink), 0 6px 0 rgba(190,140,115,.28) !important; }
        #joystick-base { border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 4px rgba(255,255,255,.5); }
        #joystick-stick { border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink), inset 0 -4px 0 rgba(0,0,0,.12); }
        .btn { border-radius: 50% !important; }
        #top-ui { border-bottom: 3px dotted var(--ink) !important; }
        .guide-text, .status-text { color: var(--text) !important; }
        #top-ui .guide-text { border: 0 !important; box-shadow: none !important; background: none; border-radius: 0; padding: 0; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h2><i class="ic" style="--ix:0;--iy:2;--is:2"></i> 봉봉아 한 입만!</h2>
        <div class="stats">
            <div class="stat-bars">
                <div class="stress-bar"><i class="ic" style="--ix:5;--iy:2;--is:1"></i> 스트레스 <span id="stress-text">50</span></div>
                <div class="health-bar"><i class="ic" style="--ix:6;--iy:2;--is:1"></i> 건강 <span id="hp-text">50</span></div>
            </div>
            <div id="buff-status">✨ 오늘의 버프 없음</div>
        </div>
    </div>

    <div id="kitchen-phase" class="phase active">
        <div id="scene" class="scene">
            <div id="scene-dog" class="dog-host"></div>
            <div id="scene-fx" class="fx-layer"></div>
        </div>
        <div class="bonbong-status" id="bonbong-mood">봉봉이: "어이 닝겐, 밥그릇 빈 거 안 보이냐? 배고파서 현기증 난다멍." 😒</div>
        <button class="btn-maze" onclick="startCatchGame()"><i class="ic" style="--ix:1;--iy:2;--is:1"></i> 시장으로 재료 구하러 가기 (30초)</button>

        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 15px; padding: 0 6px;">
            <h3 style="font-size: 14px; margin: 0; text-align: left;">가방 속 재료 <span style="font-size:11px; color:#666;">(영양제 등은 단독 터치 시 바로 사용!)</span></h3>
            <span style="font-size: 13px; font-weight: bold; color: #e64a19; white-space: nowrap;"><span id="inven-count">0</span> / 20</span>
        </div>

        <div class="inventory" id="inventory-ui"></div>

        <div class="cook-board">
            <p style="margin: 0 0 10px 0; font-size: 13px;">냄비에 담긴 재료: <span id="selected-list">없음</span></p>

            <div id="action-buttons" style="display: flex; gap: 5px; justify-content: center; flex-wrap: wrap;">
                <button id="btn-cook" onclick="cook()"><i class="ic" style="--ix:2;--iy:2;--is:1"></i> 요리하기 (2~5개)</button>
                <button id="btn-sell" style="background: #9c27b0; display: none;" onclick="sellToCat()"><i class="ic" style="--ix:3;--iy:2;--is:1"></i> 고양이에게 팔기 (3개)</button>
            </div>

            <div id="animation-area">
                <div id="anim-text"></div>
            </div>
        </div>

        <div id="result-msg"></div>
        <button class="btn-home" style="width: calc(100% - 10px); margin-top: 10px;" onclick="goHome()"><i class="ic" style="--ix:4;--iy:2;--is:1"></i> 메인 허브로 돌아가기</button>
    </div>

    <div id="catch-phase" class="phase">
        <div id="catch-header">
            <h3 style="margin: 0; font-size: 16px;">시장 지붕 타기! <i class="ic" style="--ix:1;--iy:2;--is:1"></i></h3>
            <div class="timer-box"><i class="ic" style="--ix:1;--iy:3;--is:1"></i> <span id="time-left">30</span>초</div>
        </div>
        <div class="instruction-box">
            <p style="font-size: 12px; margin: 0; color: #d32f2f; font-weight: bold; line-height: 1.5;">📱 <b>조작법:</b> 좌/우 터치로 이동! ✨ 발판 자동 점프! 🚨 떨어지면 재료 상실!</p>
        </div>
        <div id="catch-board"></div>
        <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-weight:bold; color:#2e7d32; font-size: 13px;">장바구니: <span id="collected-count">0</span>개 담음</span></div>
    </div>

    <div id="hospital-phase" class="phase">
        <div class="siren"><i class="ic" style="--ix:7;--iy:2;--is:3"></i><i class="ic" style="--ix:0;--iy:3;--is:3"></i><i class="ic" style="--ix:7;--iy:2;--is:3"></i></div>
        <h2>동물병원 응급실</h2>
        <p style="font-size: 14px; font-weight: bold; margin-bottom: 20px; line-height: 1.5;" id="gameover-reason"></p>
        <p>봉봉이: "이 바보 같은 인간아!! 주사는 싫다멍!!! 으악!!" 😵</p>
        <button style="width: calc(100% - 10px); background: #c62828;" onclick="returnFromHospital()">치료받고 억지로 귀가하기<br><span style="font-size:11px;">(건강 +30, 스트레스 +50)</span></button>
    </div>
</div>

<script src="bongbong-sprite.js"></script>
<script>
// =====================================================================
//  도트 연출 엔진 (화면 표현만 담당 — 게임 규칙은 아래 원래 스크립트에 그대로 있습니다)
//   · 주방 장면: 봉봉이 / 냄비 / 불꽃 / 김 / 고양이 / 감정 이모트
//   · 시장 미니게임: 봉봉이 점프 자세, 재료 획득 반짝임
// =====================================================================
const FXM = {"cell": 32, "cols": 6, "rows": 9, "fx": {"fire": {"row": 0, "frames": 4}, "steam": {"row": 1, "frames": 4}, "pot": {"row": 2, "frames": 4}, "sparkle": {"row": 3, "frames": 4}, "emote": {"row": 4, "frames": 6}, "stink": {"row": 5, "frames": 3}, "bubble": {"row": 6, "frames": 3}, "burst": {"row": 7, "frames": 4}, "cat": {"row": 8, "frames": 3}}};
const ICM = {"cols": 8, "rows": 4, "idx": {"소고기": 0, "돼지고기": 1, "닭고기": 2, "고구마": 3, "브로콜리": 4, "당근": 5, "연어": 6, "포도": 7, "양파": 8, "초콜릿": 9, "황금 뼈다귀": 10, "무지개 사탕": 11, "특효 영양제": 12, "행운의 간식": 13, "흙묻은 장갑": 14, "선물": 15, "dog": 16, "cart": 17, "fire": 18, "cat": 19, "home": 20, "bolt": 21, "heart": 22, "siren": 23, "hospital": 24, "timer": 25, "pot": 26, "bag": 27}};
const ART_W = 144;                       // 배경 도트 그림 가로 (eat_kitchen_bg.png)
const POT = { x: 107, y: 56 };           // 냄비 바닥 중심 (도트 좌표)
const FIRE_Y = 61;                       // 불꽃 바닥
const DOG = { x: 36, y: 98 };            // 봉봉이 발 위치
const BOWL = { x: 57, y: 97 };           // 밥그릇
const CAT = { x: 77, y: 60 };            // 고양이가 앉는 카운터 위
const DISH_REACT = { "최고급 서프 앤 터프 특식": 'love', "초록빛 풀때기 범벅": 'angry', "야채 쏙 숨긴 고기완자": 'grudge',
                     "단백질 폭탄 파티": 'happy', "퍽퍽한 고구마 뭉치": 'choke', "대충 쓰까먹는 밥": 'meh' };
const EMOTE = { heart: 0, anger: 1, sweat: 2, quest: 3, excl: 4, dots: 5 };

let U = 3;                               // 도트 1칸의 화면 크기(px)
let kDog = null, scene = null, dogHost = null, fxLayer = null, potEl = null, fireEl = null, catEl = null, bowlBox = null;
let pDog = null, bounceTick = 0;         // 시장 미니게임용
const SCENE = { busy: false, timers: [], ints: [], react: null };

const rnd = (a, b) => a + Math.random() * (b - a);
function later(fn, ms) { const t = setTimeout(fn, ms); SCENE.timers.push(t); return t; }
function every(fn, ms) { const t = setInterval(fn, ms); SCENE.ints.push(t); return t; }
function clearAll() { SCENE.timers.forEach(clearTimeout); SCENE.ints.forEach(clearInterval); SCENE.timers = []; SCENE.ints = []; }

// 도트 아이콘 HTML (k = 16px 기준 배율)
function iconHTML(name, k) {
    const i = ICM.idx[name]; if (i === undefined) return '❓';
    return `<i class="ic" style="--ix:${i % ICM.cols};--iy:${Math.floor(i / ICM.cols)};--is:${k || 1}"></i>`;
}

// ---------- 효과 스프라이트 ----------
function fxSprite(layer, name, cx, cy, o) {
    o = o || {};
    const m = FXM.fx[name], ppa = o.ppa || U, size = FXM.cell * ppa * (o.k || 1);
    const el = document.createElement('div');
    el.className = 'fx';
    el.style.cssText = `width:${size}px;height:${size}px;left:${cx * ppa - size / 2}px;top:${cy * ppa - size / 2}px;` +
        `background-size:${FXM.cols * size}px ${FXM.rows * size}px;`;
    el._m = m; el._size = size;
    setFrame(el, o.frame || 0);
    layer.appendChild(el);
    return el;
}
function setFrame(el, f) { el.style.backgroundPosition = `${-f * el._size}px ${-el._m.row * el._size}px`; }
function loopFx(el, fps, seq) {
    const arr = seq || Array.from({ length: el._m.frames }, (_, k) => k); let i = 0;
    el._t = setInterval(() => { i = (i + 1) % arr.length; setFrame(el, arr[i]); }, 1000 / fps);
    return el._t;
}
// 떠올랐다 사라지는 효과
function pop(name, frame, cx, cy, o) {
    o = o || {};
    const layer = o.layer || fxLayer, ppa = o.ppa || U;
    const el = fxSprite(layer, name, cx, cy, { frame: frame, k: o.k, ppa: ppa });
    if (o.fps) loopFx(el, o.fps, o.seq);
    const done = () => { clearInterval(el._t); el.remove(); };
    const dx = (o.dx || 0) * ppa, dy = (o.dy || 0) * ppa;
    if (!el.animate) { setTimeout(done, o.ms || 900); return el; }
    const a = el.animate([
        { transform: 'translate(0,0) scale(.6)', opacity: 0 },
        { transform: `translate(${dx * 0.3}px,${dy * 0.3}px) scale(1.05)`, opacity: 1, offset: 0.2 },
        { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: o.fade === false ? 1 : 0 }
    ], { duration: o.ms || 900, easing: 'steps(8,end)' });
    a.onfinish = done;
    return el;
}
function emote(e) {          // 봉봉이 머리 위 감정 표시
    const x = DOG.x + rnd(6, 14), y = DOG.y - 38 + rnd(-2, 2);
    if (e[0] === 'emote') pop('emote', e[1], x, y, { k: 1.5, dy: -8, ms: 1000 });
    else if (e[0] === 'sparkle') pop('sparkle', 0, DOG.x + rnd(-14, 20), DOG.y - rnd(24, 46), { fps: 10, seq: [0, 1, 2, 3], ms: 800, k: 1.2, fade: true });
    else if (e[0] === 'stink') pop('stink', Math.floor(rnd(0, 3)), DOG.x + rnd(2, 12), DOG.y - 36, { dy: -10, ms: 1100, k: 1.1 });
}
// 재료 아이콘 (날아가는 용)
function iconEl(layer, name, cx, cy, k) {
    const i = ICM.idx[name]; if (i === undefined) return null;
    const px = 16 * U * k, el = document.createElement('div');
    el.className = 'fx fly';
    el.style.cssText = `width:${px}px;height:${px}px;left:${cx * U - px / 2}px;top:${cy * U - px / 2}px;background:url('eat_icons.png') no-repeat;image-rendering:pixelated;` +
        `background-size:${ICM.cols * px}px ${ICM.rows * px}px;background-position:${-(i % ICM.cols) * px}px ${-Math.floor(i / ICM.cols) * px}px;`;
    layer.appendChild(el); return el;
}

// ---------- 장면 배치 ----------
function layoutStatic() {
    fxLayer.innerHTML = '';
    fireEl = fxSprite(fxLayer, 'fire', POT.x, FIRE_Y - 8); fireEl.style.display = 'none';
    potEl = fxSprite(fxLayer, 'pot', POT.x, POT.y - 13);
    catEl = fxSprite(fxLayer, 'cat', CAT.x, CAT.y - 14); catEl.style.display = 'none';
    bowlBox = document.createElement('div'); bowlBox.style.cssText = 'position:absolute;inset:0;'; fxLayer.appendChild(bowlBox);
}
function layoutDog() {
    if (!kDog) return;
    const s = U / 6;
    kDog.setScale(s);
    dogHost.style.width = (214 * s) + 'px'; dogHost.style.height = (190 * s) + 'px';
    dogHost.style.left = (DOG.x * U - 107 * s) + 'px'; dogHost.style.top = (DOG.y * U - 190 * s) + 'px';
}
function fitScene() {
    if (!scene) return;
    const w = scene.clientWidth; if (!w) return;
    U = w / ART_W;
    if (!SCENE.busy) layoutStatic();
    layoutDog();
}
function initKitchen() {
    scene = document.getElementById('scene'); dogHost = document.getElementById('scene-dog'); fxLayer = document.getElementById('scene-fx');
    if (typeof BongbongSprite === 'undefined') { dogHost.textContent = '🐕'; dogHost.style.fontSize = '60px'; return; }
    kDog = new BongbongSprite(dogHost, { scale: 0.5, fps: 10, base: 'beg' });
    kDog.idle();
    fitScene();
}

// ---------- 요리 / 판매 연출 ----------
function dropItem(name, i) {
    const x0 = POT.x - 38 + i * 6, y0 = 14, x1 = POT.x + rnd(-3, 3), y1 = POT.y - 26;
    const el = iconEl(fxLayer, name, x0, y0, 0.75); if (!el) return;
    const dx = (x1 - x0) * U, dy = (y1 - y0) * U;
    if (!el.animate) { setTimeout(() => el.remove(), 500); return; }
    const a = el.animate([
        { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1 },
        { transform: `translate(${dx * 0.55}px,${dy * 0.15}px) scale(1) rotate(120deg)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${dx}px,${dy}px) scale(.45) rotate(240deg)`, opacity: 0.2 }
    ], { duration: 520, easing: 'steps(10,end)' });
    a.onfinish = () => { el.remove(); setFrame(potEl, 1); later(() => setFrame(potEl, 0), 120); };
}
function crumb() {
    const x = BOWL.x + rnd(-5, 5), y = BOWL.y - 6, sz = U * 1.2, el = document.createElement('div');
    el.className = 'crumb';
    el.style.cssText = `width:${sz}px;height:${sz}px;left:${x * U}px;top:${y * U}px;background:${['#d9a066', '#a0693f', '#ffcc80'][Math.floor(rnd(0, 3))]};`;
    fxLayer.appendChild(el);
    if (!el.animate) { setTimeout(() => el.remove(), 500); return; }
    const sx = rnd(-8, 8) * U;
    el.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${sx * 0.5}px,${-9 * U}px)`, offset: 0.4 }, { transform: `translate(${sx}px,${5 * U}px)`, opacity: 0 }],
        { duration: 520, easing: 'steps(6,end)' }).onfinish = () => el.remove();
}
function serve(items, glove) {            // 요리를 밥그릇에 담고 먹는 장면
    bowlBox.innerHTML = '';
    items.slice(0, 3).forEach((n, i) => { const el = iconEl(bowlBox, glove ? '흙묻은 장갑' : n, BOWL.x - 6 + i * 6, BOWL.y - 3 - (i === 1 ? 2 : 0), 0.45); if (el) el.style.zIndex = 4; });
    if (kDog) { kDog.pose('begB'); dogHost.classList.add('chew'); }
    every(crumb, 170);
}
SCENE.play = function (kind, ms, items) {
    if (!scene || !scene.clientWidth) return;
    clearAll(); SCENE.busy = true; clearReact();
    items = items || [];
    if (kind === 'sell') {                // 고양이가 주머니를 뒤적거림
        catEl.style.display = 'block'; loopFx(catEl, 3, [0, 1]);
        const gift = fxSprite(fxLayer, 'cat', CAT.x + 12, CAT.y - 4, { frame: 2, k: 0.7 });
        gift.animate && gift.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-4 * U}px)` }, { transform: 'translateY(0)' }], { duration: 500, iterations: Infinity, easing: 'steps(2,end)' });
        later(() => gift.remove(), ms - 50);
        every(() => pop('sparkle', 0, CAT.x + rnd(-8, 18), CAT.y - rnd(14, 30), { fps: 10, seq: [0, 1, 2, 3], ms: 700, k: 0.9, fade: true }), 260);
        later(() => pop('burst', 0, CAT.x + 6, CAT.y - 20, { fps: 12, seq: [0, 1, 2, 3], ms: 500, k: 1.2 }), ms - 450);
        return;
    }
    const glove = kind === 'glove', cookMs = ms - 800;
    fireEl.style.display = 'block'; loopFx(fireEl, 10);
    let li = 0; const rat = [0, 1, 0, 2];
    const rattle = every(() => setFrame(potEl, rat[li++ % 4]), 130);
    const vapor = every(() => {
        if (glove) pop('stink', Math.floor(rnd(0, 3)), POT.x + rnd(-5, 5), POT.y - 22, { ms: 1000, dy: -16, k: 0.9 });
        else pop('steam', 0, POT.x + rnd(-5, 5), POT.y - 20, { ms: 1000, dy: -20, fps: 6, seq: [0, 1, 2, 3] });
    }, 230);
    items.slice(0, 5).forEach((n, i) => later(() => dropItem(n, i), 150 + i * 230));
    later(() => {                          // 완성! 뚜껑이 펑
        clearInterval(rattle); clearInterval(vapor);
        setFrame(potEl, 3);
        pop('burst', 0, POT.x, POT.y - 24, { fps: 12, seq: [0, 1, 2, 3], ms: 520, k: 1.3 });
        if (!glove) { pop('sparkle', 0, POT.x - 12, POT.y - 30, { fps: 10, seq: [0, 1, 2, 3], ms: 700, k: 1 }); pop('sparkle', 0, POT.x + 12, POT.y - 26, { fps: 10, seq: [0, 1, 2, 3], ms: 700, k: 1 }); }
    }, cookMs);
    later(() => { setFrame(potEl, 0); fireEl.style.display = 'none'; clearInterval(fireEl._t); }, cookMs + 450);
    later(() => serve(items, glove), cookMs + 150);
};
SCENE.end = function () {
    clearAll(); SCENE.busy = false;
    if (!scene) return;
    if (fireEl) { clearInterval(fireEl._t); fireEl.style.display = 'none'; }
    if (potEl) setFrame(potEl, 0);
    if (catEl) { clearInterval(catEl._t); catEl.style.display = 'none'; }
    if (bowlBox) bowlBox.innerHTML = '';
    if (dogHost) dogHost.classList.remove('chew');
    if (kDog) kDog.idle();
};

// ---------- 봉봉이 감정 반응 ----------
const REACT = {
    love:   { play: 'jump', cls: 'm-spin', em: [['emote', 0], ['emote', 0], ['emote', 0]], ms: 1900 },
    happy:  { play: 'jump', em: [['sparkle'], ['sparkle'], ['sparkle']], ms: 1900 },
    cheer:  { play: 'jump', cls: 'm-dance', em: [['sparkle'], ['emote', 0], ['sparkle']], ms: 1900 },
    angry:  { pose: 'stand', cls: 'shake', em: [['emote', 1], ['emote', 4]], ms: 1600 },
    grudge: { pose: 'sit', em: [['emote', 2], ['emote', 5]], ms: 1600 },
    choke:  { pose: 'stand', cls: 'm-shiver', em: [['emote', 2], ['emote', 3]], ms: 1600 },
    meh:    { pose: 'sit', em: [['emote', 5]], ms: 1500 },
    sick:   { pose: 'stand', cls: 'shake sick', em: [['stink'], ['stink'], ['emote', 2]], ms: 2000 },
        dance:    { pose: 'stand', cls: 'm-dance',  em: [['emote', 0], ['sparkle'], ['sparkle'], ['emote', 0]], ms: 2200 },
        spin:     { play: 'jump', cls: 'm-spin',    em: [['sparkle'], ['sparkle']], ms: 1900 },
        roll:     { pose: 'stand', cls: 'm-roll',   em: [['sparkle']], ms: 1300 },
        faint:    { pose: 'stand', cls: 'm-faint',  em: [['emote', 2], ['emote', 3]], ms: 2600 },
        shiver:   { pose: 'stand', cls: 'm-shiver', em: [['emote', 2], ['emote', 2]], ms: 1400 },
        tilt:     { pose: 'sit', cls: 'm-tilt',     em: [['emote', 3]], ms: 1500 },
        surprise: { pose: 'stand', cls: 'm-bounce', em: [['emote', 4]], ms: 1000 },
        bounce:   { pose: 'begB', cls: 'm-bounce',  em: [['sparkle']], ms: 1000 },
        sleep:    { pose: 'sit', cls: 'm-breath',   em: [['emote', 5]], ms: 2600 },
        hello:    { play: 'hi5', em: [['sparkle']], ms: 2100 },
        wiggle:   { pose: 'begA', cls: 'm-wiggle',  em: [], ms: 1000 }
};
function clearReact() {
    if (SCENE.react) { clearTimeout(SCENE.react); SCENE.react = null; }
    if (dogHost) dogHost.className = 'dog-host';
}
function reactDog(kind, soft) {
    if (!kDog || !scene || !scene.clientWidth) return;
    SCENE.busy = Date.now() + (REACT[kind] || REACT.meh).ms + (soft ? 1500 : 4000);
    const r = REACT[kind] || REACT.meh;
    clearReact();
    if (r.play) kDog.play(r.play); else kDog.pose(r.pose);
    if (r.cls) dogHost.className = 'dog-host ' + r.cls;
    r.em.forEach((e, i) => setTimeout(() => emote(e), i * 320));
    SCENE.react = setTimeout(() => { dogHost.className = 'dog-host'; kDog.idle(); SCENE.react = null; }, r.ms);
}

// ---------- 시장 미니게임: 봉봉이 / 반짝임 ----------
function initPlayerSprite() {
    destroyPlayerSprite();
    if (typeof BongbongSprite === 'undefined') { document.getElementById('player').textContent = '🐕'; return; }
    const h = document.createElement('div'); h.className = 'pl-host';
    document.getElementById('player').appendChild(h);
    pDog = new BongbongSprite(h, { scale: 0.25 }); pDog._k = ''; pDog.pose('takeoff');
}
function destroyPlayerSprite() { if (pDog) { pDog.stop(); pDog = null; } }
function updatePlayerPose() {
    if (!pDog) return;
    let k;
    if (bounceTick > 0) { bounceTick--; k = 'takeoff'; }
    else if (vY < -5) k = 'up';
    else if (vY < 5) k = 'apex';
    else if (vY < 11) k = 'fall';
    else k = 'land';
    if (k !== pDog._k) { pDog._k = k; pDog.pose(k); }
}
function catchSparkle(x, y) {
    const board = document.getElementById('catch-board'); if (!board) return;
    pop('sparkle', 0, x / 1.5, y / 1.5, { layer: board, ppa: 1.5, fps: 12, seq: [0, 1, 2, 3], ms: 450, k: 1.1, dy: -6 });
}

window.addEventListener('resize', fitScene);
window.addEventListener('load', () => { initKitchen(); setTimeout(fitScene, 60); });

// 주방에서 가만히 있을 때 혼자서 이것저것 하는 봉봉이
setInterval(() => {
    if (document.hidden || !kDog || !scene || !scene.clientWidth || SCENE.react || Date.now() < (SCENE.busy || 0) || (typeof isAnimating !== 'undefined' && isAnimating) || Math.random() < 0.35) return;
    const pool = ['tilt', 'wiggle', 'hello', 'bounce', 'sleep', 'tilt', 'wiggle'];
    reactDog(pool[Math.floor(Math.random() * pool.length)], true);
}, 4200);

</script>

    const msgMeatBomb = [ `"크~ 이 집 노예 일 일 잘하네. 내일도 이렇게 바쳐라멍!" 🍖`, `"그래, 밥은 이래야지! 꼬리 프로펠러 풀가동!!" 🚁💖` ];
    const msgSweet = [ `"켁켁... 목 막혀 죽일 셈이냐 멍! 당장 물 가져와!" 🍠💧`, `"달아서 좋긴 한데... 혓바닥에 다 달라붙는다멍! 쩝쩝..." 👅` ];
    const msgNormal = [ `"뭐 이딴 걸 밥이라고... 배고프니 일단 먹는다." 🙄`, `"그럭저럭 넘길 만 하네." 🍽️` ];
    const msgSurfAndTurf = [ `"소고기에 연어?! 닝겐, 오늘 로또 맞았냐멍?! 사랑한다멍!!" 😍✨`, `"이것이 바로 미슐랭 3스타! 그릇까지 핥아먹겠다멍!" 👅💦` ];

    function getRandomMsg(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function updateStats(hpAmount, stressAmount) {
        if (bongbongData.dailyBuff && bongbongData.dailyBuff.date === todayDate) {
            if ((bongbongData.dailyBuff.type === 'buff_all' || bongbongData.dailyBuff.type === 'buff_hp') && hpAmount < 0) {
                hpAmount = 0; 
            }
            if ((bongbongData.dailyBuff.type === 'buff_all' || bongbongData.dailyBuff.type === 'buff_stress') && stressAmount > 0) {
                stressAmount = 0; 
            }
        }

        health += hpAmount; 
        stress += stressAmount;
        let maxStress = 100 - ((bongbongData.collectedToys || []).length * 10);

        if (health > 100) health = 100;
        if (stress > maxStress) stress = maxStress; 
        if (stress < 0) stress = 0; 

        document.getElementById('hp-text').innerText = health; 
        document.getElementById('stress-text').innerText = stress;
        
        bongbongData.health = health; 
        bongbongData.stress = stress; 
        bongbongData.feedLastPlayed = Date.now(); 
        localStorage.setItem('bongbongData', JSON.stringify(bongbongData));

        if (health <= 10) { document.getElementById('gameover-reason').innerText = "건강 관리에 실패해서 봉봉이가 응급실에 실려갔습니다!"; switchPhase('hospital-phase'); }
    }
    
    function returnFromHospital() {
        bongbongData.health += 30; bongbongData.stress += 50;
        let maxStress = 100 - ((bongbongData.collectedToys || []).length * 10);
        if(bongbongData.health > 100) bongbongData.health = 100;
        if(bongbongData.stress > maxStress) bongbongData.stress = maxStress;
        localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
        window.location.href = 'index.html'; 
    }

    function goHome() { window.location.href = 'index.html'; }
    function switchPhase(phaseId) { document.querySelectorAll('.phase').forEach(el => el.classList.remove('active')); document.getElementById(phaseId).classList.add('active'); if (phaseId === 'kitchen-phase') requestAnimationFrame(fitScene); }

    function playAnimation(kind, text, duration, callback) {
        isAnimating = true;
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('result-msg').innerHTML = '';

        const animArea = document.getElementById('animation-area');
        animArea.style.display = 'block';
        document.getElementById('anim-text').innerText = text;
        SCENE.play(kind, duration, selectedIngredients.map(v => v.name));   // 주방 장면 연출 시작

        setTimeout(() => {
            animArea.style.display = 'none';
            document.getElementById('action-buttons').style.display = 'flex';
            isAnimating = false;
            SCENE.end();
            callback();
        }, duration);
    }

    function updateInventoryUI() {
        const invenUI = document.getElementById('inventory-ui'); 
        invenUI.innerHTML = ''; 
        selectedIngredients = [];
        document.getElementById('selected-list').innerText = "없음"; 
        document.getElementById('inven-count').innerText = myItems.length;
        document.getElementById('btn-sell').style.display = 'none';

        if (myItems.length === 0) { 
            invenUI.innerHTML = '<span style="color:#999; font-size:14px; line-height: 70px;">가방이 텅 비었어요. 시장에 다녀오세요!</span>'; 
            return; 
        }

        myItems.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'item';
            
            if (SPECIAL_ITEMS[item]) {
                div.style.backgroundColor = "#f3e5f5"; 
                if(SPECIAL_ITEMS[item].type !== 'trash') {
                    div.innerHTML += `<div style="position:absolute; top:-5px; right:-5px; background:#e65100; color:white; font-size:9px; padding:2px 4px; border-radius:5px; font-weight:bold;">단독사용</div>`;
                }
            }
            
            div.innerHTML += `<div class="emoji">${iconHTML(item, 2)}</div><div class="name">${item}</div>`;
            div.onclick = function() { selectItem(this, item, index); };
            invenUI.appendChild(div);
        });
    }

    updateInventoryUI();

    function selectItem(element, itemName, index) {
        if(isAnimating) return; 

        if (SPECIAL_ITEMS[itemName] && SPECIAL_ITEMS[itemName].type !== 'trash') {
            if(confirm(`[ ${itemName} ]을(를) 지금 바로 사용하시겠습니까?\n(냄비에 넣지 않고 즉시 봉봉이에게 줍니다)`)) {
                useSpecialItemImmediately(itemName, index);
            }
            return; 
        }

        let existingIndex = selectedIngredients.findIndex(val => val.index === index);
        if (existingIndex > -1) { 
            selectedIngredients.splice(existingIndex, 1); 
            element.classList.remove('selected'); 
        } else { 
            if (selectedIngredients.length < 5) { 
                selectedIngredients.push({name: itemName, index: index}); 
                element.classList.add('selected'); 
            } else { alert("냄비가 꽉 찼어요!"); } 
        }

        let names = selectedIngredients.map(val => iconHTML(val.name, 2));
        document.getElementById('selected-list').innerHTML = names.length > 0 ? names.join(' ') : "없음";
        
        document.getElementById('btn-sell').style.display = (selectedIngredients.length === 3) ? 'block' : 'none';
    }

    function useSpecialItemImmediately(itemName, index) {
        const item = SPECIAL_ITEMS[itemName];
        reactDog(item.type === 'instant' ? 'love' : 'cheer');
        myItems.splice(index, 1);
        
        if (item.type.startsWith('buff')) {
            bongbongData.dailyBuff = { type: item.type, date: todayDate };
            if (item.type === 'buff_all') updateStats(100, -100);
            if (item.type === 'buff_stress') updateStats(0, -100);
            if (item.type === 'buff_hp') updateStats(100, 0);
            updateBuffUI();
        } else if (item.type === 'instant') {
            updateStats(item.hp, item.stress);
        }

        bongbongData.inventory = myItems;
        localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
        updateInventoryUI();

        document.getElementById('result-msg').innerHTML = `
            <div style="background:#e8f5e9; padding:10px; border-radius:10px; border:2px solid #4caf50;">
                <p style="margin:5px 0; font-size:16px; font-weight:bold; color:#2e7d32;">✨ [ ${itemName} ] 사용 완료! ✨</p>
                <p style="margin:0; font-size:13px; color:#1b5e20;">${item.msg}</p>
            </div>
        `;
    }

    function sellToCat() {
        if(isAnimating) return;
        if (selectedIngredients.length !== 3) return;

        playAnimation('sell', "고양이가 주머니를 뒤적거리는 중...", 2000, () => {
            const gloveCount = selectedIngredients.filter(item => item.name === "흙묻은 장갑").length;
            selectedIngredients.sort((a,b) => b.index - a.index).forEach(val => myItems.splice(val.index, 1));

            if (gloveCount === 3) {
                document.getElementById('result-msg').innerHTML = `
                    <div style="background:#ffcdd2; padding:10px; border-radius:10px; border:2px solid #d32f2f;">
                        <p style="margin:0; font-size:13px; color:#b71c1c;">🐱 시장 고양이: "야!!! 내가 준 소중한 보물을 3개나 모아서 다시 짬처리하냥?! 반품 절대 안 받는다냥!!" 😾💢</p>
                        <p style="margin:5px 0; font-size:16px; font-weight:bold;">✨ [ 흙묻은 장갑 ] 반환... ✨</p>
                        <p style="margin:0; font-size:12px; color:#666;">고양이가 화를 내며 장갑 1개를 다시 던지고 도망갔습니다...</p>
                    </div>
                `;
                myItems.push("흙묻은 장갑");
                bongbongData.inventory = myItems;
                localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
                updateInventoryUI();
                return;
            }

            const rand = Math.random() * 100;
            let giftName = "";
            let catMessage = "🐱 시장 고양이: \"츄르 고맙다냥! 보답으로 이걸 줄게!\"";

            if (rand < 1) { giftName = "황금 뼈다귀"; } 
            else if (rand < 5) { giftName = "무지개 사탕"; } 
            else if (rand < 15) { giftName = "특효 영양제"; } 
            else if (rand < 40) { giftName = "행운의 간식"; } 
            else { 
                giftName = "흙묻은 장갑"; 
                catMessage = "🐱 시장 고양이: \"츄르 잘 먹었다냥! 🐾 이거 내가 진짜 아끼고 아끼는 엄청 좋은 건데 특별히 너 주는 거다냥!\" (당당)";
            }

            const gift = SPECIAL_ITEMS[giftName];
            
            document.getElementById('result-msg').innerHTML = `
                <div style="background:#f3e5f5; padding:10px; border-radius:10px; border:2px solid #9c27b0;">
                    <p style="margin:0; font-size:13px; color:#7b1fa2;">${catMessage}</p>
                    <p style="margin:5px 0; font-size:16px; font-weight:bold;">✨ [ ${giftName} ] 획득! ✨</p>
                    <p style="margin:0; font-size:12px; color:#666;">(가방에 쏙 들어갔습니다. 터치해서 바로 사용하세요!)</p>
                </div>
            `;

            myItems.push(giftName);
            bongbongData.inventory = myItems;
            localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
            updateInventoryUI();
        });
    }

    function cook() {
        if(isAnimating) return;
        
        let hasToxic = selectedIngredients.find(item => toxicItems.includes(item.name));
        if (hasToxic) { document.getElementById('gameover-reason').innerText = `미쳤습니까 휴먼?! 강아지에게 치명적인 맹독 [${hasToxic.name}]을(를) 먹였습니다!`; switchPhase('hospital-phase'); return; }

        let count = selectedIngredients.length;
        if (count < 2 || count > 5) { alert("요리하려면 재료를 2~5개 넣어주세요."); return; }
        
        let hasGlove = selectedIngredients.find(item => item.name === "흙묻은 장갑");
        if (hasGlove) {
            playAnimation('glove', "장갑 끓는 냄새가 진동합니다...", 2300, () => {
                updateStats(-10, 20);
                reactDog('sick');
                document.getElementById('result-msg').innerHTML = `<span style="color:#c62828; font-size:16px;">[ 흙탕물 잡탕 ]</span> 완성!<br>우웩! 봉봉이가 토를 했습니다! (건강 -10, 스트레스 +20) 😡`;
                selectedIngredients.sort((a,b) => b.index - a.index).forEach(val => myItems.splice(val.index, 1));
                bongbongData.inventory = myItems; localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
                updateInventoryUI();
            });
            return;
        }

        playAnimation('cook', "보글보글... 맛있는 요리가 완성되는 중!", 2300, () => {
            let counts = { "소고기": 0, "돼지고기": 0, "닭고기": 0, "고구마": 0, "브로콜리": 0, "당근": 0, "연어": 0 };
            selectedIngredients.forEach(item => { if(counts[item.name] !== undefined) counts[item.name]++; });

            let protein = counts["소고기"] + counts["돼지고기"] + counts["닭고기"] + counts["연어"];
            let veggie = counts["브로콜리"] + counts["당근"]; let sweet = counts["고구마"];
            let dishName = ""; let reaction = ""; let hpChange = 0; let stressChange = 0; 

            if (counts["소고기"] > 0 && counts["연어"] > 0 && veggie === 0) { dishName = "최고급 서프 앤 터프 특식"; reaction = getRandomMsg(msgSurfAndTurf) + ` <br>(건강 -5, 스트레스 -15 풀림✨)`; hpChange = -5; stressChange = -15; } 
            else if (veggie > protein && veggie > 0) { dishName = "초록빛 풀때기 범벅"; reaction = getRandomMsg(msgVeggieFail) + ` <br>(스트레스! 건강 -5, 스트레스 +15😡)`; hpChange = -5; stressChange = 15; } 
            else if (veggie > 0 && protein >= veggie) { dishName = "야채 쏙 숨긴 고기완자"; reaction = getRandomMsg(msgVeggieHidden) + ` <br>(균형 잡힌 식단! 건강 +10)`; hpChange = 10; stressChange = 0; } 
            else if (protein === count) { dishName = "단백질 폭탄 파티"; reaction = getRandomMsg(msgMeatBomb) + ` <br>(비만 경고! 건강 -15, 스트레스 -10 풀림✨)`; hpChange = -15; stressChange = -10; } 
            else if (sweet === count) { dishName = "퍽퍽한 고구마 뭉치"; reaction = getRandomMsg(msgSweet) + ` <br>(건강 -5, 목막혀서 스트레스 +5💢)`; hpChange = -5; stressChange = 5; } 
            else { dishName = "대충 쓰까먹는 밥"; reaction = getRandomMsg(msgNormal) + ` <br>(건강, 스트레스 변화 없음)`; hpChange = 0; stressChange = 0; }

            if (counts["돼지고기"] > 0) { reaction += `<br><span style="color:#d32f2f; font-size:13px;">🚨 싼맛 돼지고기 탓에 배탈이 났다! (추가 건강 -10, 스트레스 +5)</span>`; hpChange -= 10; stressChange += 5; }

            updateStats(hpChange, stressChange);
            reactDog(counts["돼지고기"] > 0 ? 'sick' : (DISH_REACT[dishName] || 'meh'));
            document.getElementById('result-msg').innerHTML = `<span style="color:#e64a19; font-size:16px;">[ ${dishName} ]</span> 완성!<br>${reaction}`;

            selectedIngredients.sort((a,b) => b.index - a.index).forEach(val => myItems.splice(val.index, 1));
            bongbongData.inventory = myItems; localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
            updateInventoryUI();
        });
    }

    // 💡 미니게임 난이도 패치 (속도 증가, 발판 크기 증가, 세로 간격 감소)
    let pX = 0, pY = 250, vX = 0, vY = 0, gravity = 0.8, jumpPower = -13.5, keys = {};
    let collectedThisRun = 0, platforms = [], gameItems = [], timeLeft = 30, gameInterval, timerInterval;
    let boardW = 440; const boardH = 400; const catchBoard = document.getElementById('catch-board');

    function handleInputStart(e) { if(document.getElementById('catch-phase').classList.contains('active')) e.preventDefault(); let clientX = e.touches ? e.touches[0].clientX : e.clientX; let rect = catchBoard.getBoundingClientRect(); let xPos = clientX - rect.left; if (xPos < rect.width / 2) { keys["ArrowLeft"] = true; keys["ArrowRight"] = false; } else { keys["ArrowRight"] = true; keys["ArrowLeft"] = false; } }
    function handleInputEnd(e) { keys["ArrowLeft"] = false; keys["ArrowRight"] = false; }
    catchBoard.addEventListener('touchstart', handleInputStart, {passive: false}); catchBoard.addEventListener('touchend', handleInputEnd); catchBoard.addEventListener('mousedown', handleInputStart); catchBoard.addEventListener('mouseup', handleInputEnd); catchBoard.addEventListener('mouseleave', handleInputEnd);
    document.addEventListener('keydown', e => { if(["ArrowLeft", "ArrowRight"].includes(e.key)) keys[e.key] = true; }); document.addEventListener('keyup', e => { if(["ArrowLeft", "ArrowRight"].includes(e.key)) keys[e.key] = false; });

    function spawnPlatform(y) {
        // 발판 가로 길이 증가 (최소 90 ~ 최대 140)
        let w = 90 + Math.random() * 50; 
        let x = Math.random() * (boardW - w);
        let platEl = document.createElement('div'); platEl.className = 'platform'; platEl.style.width = w + 'px'; platEl.style.height = '15px'; platEl.style.left = x + 'px'; platEl.style.top = y + 'px'; catchBoard.appendChild(platEl); platforms.push({ x: x, y: y, w: w, el: platEl });
        if (Math.random() < 0.7) { let type = allItemTypes[Math.floor(Math.random() * allItemTypes.length)]; let itemEl = document.createElement('div'); itemEl.className = 'falling-item'; itemEl.innerHTML = iconHTML(type, 2); itemEl.style.left = (x + w/2 - 15) + 'px'; itemEl.style.top = (y - 30) + 'px'; catchBoard.appendChild(itemEl); gameItems.push({ type: type, x: x + w/2 - 15, y: y - 30, el: itemEl }); }
    }

    function startCatchGame() {
        clearInterval(gameInterval); clearInterval(timerInterval); switchPhase('catch-phase'); boardW = catchBoard.clientWidth || 440; keys = {}; pX = boardW / 2 - 20; pY = 250; vX = 0; vY = 0; collectedThisRun = 0; timeLeft = 30; platforms = []; gameItems = []; tempItemsThisRun = []; 
        document.getElementById('collected-count').innerText = collectedThisRun; document.getElementById('time-left').innerText = timeLeft; document.getElementById('result-msg').innerHTML = ''; 
        catchBoard.innerHTML = `<div id="player" style="left: ${pX}px; top: ${pY}px;"></div>`; initPlayerSprite(); bounceTick = 3;
        let startPlat = document.createElement('div'); startPlat.className = 'platform'; startPlat.style.width = boardW + 'px'; startPlat.style.height = '20px'; startPlat.style.left = '0px'; startPlat.style.top = '330px'; catchBoard.appendChild(startPlat); platforms.push({ x: 0, y: 330, w: boardW, el: startPlat });
        
        // 발판 세로 간격 감소 (최소 35 ~ 최대 65)
        let currentY = 230; while(currentY > -100) { spawnPlatform(currentY); currentY -= (35 + Math.random() * 30); }
        
        timerInterval = setInterval(() => { timeLeft--; document.getElementById('time-left').innerText = timeLeft; if (timeLeft <= 0) endCatchGame("타임오버! 모은 장바구니를 무사히 들고 집에 갑니다. 🏃‍♂️💨", true); }, 1000);
        gameInterval = setInterval(updatePhysics, 20);
    }

    function endCatchGame(msg, isSuccess) {
        destroyPlayerSprite();
        clearInterval(gameInterval); clearInterval(timerInterval); 
        if (isSuccess) {
            myItems = myItems.concat(tempItemsThisRun);
            if(myItems.length > 20) { alert(`${msg}\n\n앗! 가방 용량(20개)을 초과하여 넘치는 ${myItems.length - 20}개의 재료는 버렸습니다.`); myItems = myItems.slice(0, 20); } else { alert(msg); }
            bongbongData.inventory = myItems; localStorage.setItem('bongbongData', JSON.stringify(bongbongData));
        } else alert(msg);
        tempItemsThisRun = []; updateInventoryUI(); switchPhase('kitchen-phase');
    }

    function updatePhysics() {
        const playerEl = document.getElementById('player');
        // 봉봉이 좌우 이동 속도 증가 (7 -> 9)
        if (keys["ArrowLeft"]) { vX = -9; playerEl.style.transform = 'scaleX(-1)'; } else if (keys["ArrowRight"]) { vX = 9; playerEl.style.transform = 'scaleX(1)'; } else vX = 0; 
        vY += gravity; 
        platforms.forEach(p => { if (vY > 0 && pY + 40 >= p.y && pY + 40 - vY <= p.y + 15) { if (pX + 25 > p.x && pX + 15 < p.x + p.w) { pY = p.y - 40; vY = jumpPower; bounceTick = 3; } } });
        pX += vX; pY += vY; if (pX < 0) pX = 0; if (pX > boardW - 40) pX = boardW - 40;
        if (pY < 180) { let diff = 180 - pY; pY = 180; platforms.forEach(p => p.y += diff); gameItems.forEach(i => i.y += diff); }
        playerEl.style.left = pX + 'px'; playerEl.style.top = pY + 'px'; updatePlayerPose();
        platforms.forEach(p => { p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px'; }); gameItems.forEach(i => { i.el.style.left = i.x + 'px'; i.el.style.top = i.y + 'px'; });
        for (let i = gameItems.length - 1; i >= 0; i--) { let item = gameItems[i]; if (item.y + 30 > pY && item.y < pY + 40 && item.x + 30 > pX && item.x < pX + 40) { tempItemsThisRun.push(item.type); collectedThisRun++; catchSparkle(item.x + 15, item.y + 15); document.getElementById('collected-count').innerText = collectedThisRun; item.el.remove(); gameItems.splice(i, 1); } }
        platforms = platforms.filter(p => { if (p.y > boardH) { p.el.remove(); return false; } return true; }); gameItems = gameItems.filter(i => { if (i.y > boardH) { i.el.remove(); return false; } return true; });
        
        // 새로운 발판 생성 시 세로 간격 감소 적용
        let minY = Math.min(...platforms.map(p => p.y)); if (minY > 50) spawnPlatform(minY - (35 + Math.random() * 30)); 
        
        if (pY > boardH) endCatchGame("앗! 발을 헛디뎠다! 모은 재료를 다 쏟고 쫓겨났습니다. 😭", false);
    }
</script>
